# A code host: the Zenrows piece for Activepieces, rendered into dist/activepieces/
# exactly as it sits in activepieces' packages/pieces/community/zenrows.
kind: code
host: "Activepieces"
host_full: "Activepieces"
# The activepieces commit the piece is built and tested against (scripts/check.sh).
# Moving it is its own PR, so CI shows whether their newer code breaks the piece.
upstream: "6f4be340d7c4bef9fb6ff874ca72224e4933d3d2"

# The wording of the generated actions is shared with Mastra's tools, in
# shared/actions.yaml. What only Activepieces has, by endpoint id:
# omit leaves an optional field out of the form (it is never sent), because it
# means nothing in Activepieces; classification sets the badge where the one
# derived from the method is wrong.
omit:
  # download only asks the API to send the page as an attachment: the step
  # returns the same HTML either way.
  get_crawl_content: [download]
