# yaml-language-server: $schema=https://docs.o11.ai/schemas/o11-listing/2026-11-01.json
# Generated from platforms/o11/scripts/o11.yaml, vars.yaml and the API spec; edit those, not this file.
spec: 2026-11-01
provider:
  id: zenrows
  name: Zenrows
  website: https://www.zenrows.com
  docsUrl: https://docs.zenrows.com
  contactEmail: integrations@zenrows.com
  logoUrl: https://raw.githubusercontent.com/ZenRows/zenrows-integrations/main/shared/assets/logo.png
  description: "Live web data: fetch any public page as Markdown, HTML or text, pull structured fields from it as JSON, run batch jobs over many URLs, crawl a site from one start URL and drive a hosted browser for pages that need clicks, forms or pagination, with proxies, JavaScript rendering and anti-bot protection handled by Zenrows."
accounts:
  mode: none
listings:
  - type: api
    id: zenrows
    baseUrl: https://api.zenrows.com/v1
    auth:
      kind: query
      queryParam: apikey
    endpoints:
      - id: fetch
        name: Fetch a page
        description: Retrieve a URL through Zenrows and return its content. The same operation covers Extract (`extract=auto` or `css_extractor`), format conversion (`response_type`), screenshots and structured output, because they are configurations of one request rather than separate endpoints.
        method: GET
        path: /
        input:
          queryParams:
            type: object
            properties:
              url:
                type: string
                format: uri
                pattern: ^https?://
                examples:
                  - https://www.scrapingcourse.com/ecommerce/
                description: The URL of the page to retrieve. Only `http` and `https` URLs are accepted.
              mode:
                type: string
                enum:
                  - auto
                description: Adaptive Stealth Mode. `auto` starts from the cheapest viable configuration and escalates to JavaScript rendering or premium proxies only when the target requires it. You are billed for the configuration that succeeds. It manages `js_render` and `premium_proxy` itself, so setting either alongside it answers 400 `REQS004`; `proxy_country` is allowed.
              js_render:
                type: boolean
                default: false
                description: Render the page in a headless browser before returning it. Required for content that only exists after JavaScript runs. Not allowed with `mode=auto` (400 `REQS004`).
              js_instructions:
                type: string
                description: JSON array of browser instructions (click, fill, scroll, wait) executed on the page before the content is returned. Requires `js_render=true` or `mode=auto`; without either the request answers 400 `REQS004`.
              premium_proxy:
                type: boolean
                default: false
                description: Route the request through residential IPs. Required by most protected sites. Not allowed with `mode=auto` (400 `REQS004`).
              proxy_country:
                type: string
                pattern: ^[a-z]{2}$
                examples:
                  - us
                description: Two-letter country code for the exit IP. Requires `premium_proxy=true` or `mode=auto`, which then routes through premium proxies, so the request costs at least 10 credits. Alone, or with only `js_render`, the request answers 400 `REQS004`.
              response_type:
                type: string
                enum:
                  - markdown
                  - plaintext
                  - pdf
                description: "Convert the page before returning it: Markdown, plaintext or PDF. `pdf` requires `js_render=true`; without it the request answers 400 `REQS004`. Any `response_type` together with `outputs` also answers 400 `REQS004`."
              wait_for:
                type: string
                description: CSS selector to wait for before returning. Requires js_render.
              wait:
                type: integer
                default: 0
                minimum: 0
                description: Milliseconds to wait after load before returning. Requires js_render.
              block_resources:
                type: string
                description: Comma-separated resource types to block (for example `image,media,font`). Blocking is on by default.
              json_response:
                type: string
                description: Return a JSON envelope that also carries the network requests (XHR/fetch) the page made. Requires `js_render=true` or `mode=auto`; without either the request answers 400 `REQS004`.
              outputs:
                type: string
                description: Comma-separated data types to pull out of the retrieved HTML (for example `emails,phone_numbers`). Not allowed with `response_type` (400 `REQS004`); with `screenshot` the request answers 200 with no image and an empty result.
              session_id:
                type: integer
                description: Reuse the same IP across requests for up to 10 minutes. Any integer you choose identifies the session.
              original_status:
                type: boolean
                default: false
                description: Return the target's own HTTP status code instead of the Zenrows one.
              allowed_status_codes:
                type: string
                description: Comma-separated status codes whose body should be returned instead of raising an error, for example `404,500`.
            required:
              - url
        effect: read
        example:
          queryParams:
            url: https://www.scrapingcourse.com/ecommerce/
            proxy_country: us
        price:
          kind: per_unit
          priceMicros: 500
          currency: USD
          chargeOn: success
          unit: credit
          meter:
            kind: response_usage
          maximumMicros: 12500
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Credits per successful request: 1 credit for a basic request, 5 with JavaScript rendering, 10 with premium proxies and 25 with both, the same on every plan; Extract adds no credits on top of the request it runs. Each response reports the credits it used in the X-Request-Credits header. The public pay-as-you-go rate is $0.50 per 1,000 credits."
        priceTerms:
          details: "Metered from the X-Request-Credits response header: the credits the request used, times the per-credit price; a request Zenrows could not carry out uses no credits, but Zenrows counts a 404 or 410 from the target as a request it carried out, and charges for it."
      - id: extract
        name: Extract structured data from a page
        description: "Return structured JSON from a page with no selectors to write: extract=auto (or native) returns the site's own field names, standard returns a canonical schema (real estate only for now). Or pass css_extractor to map your own keys to CSS selectors. Billed as the Fetch request it runs: Extract adds no credits on top of the request it runs. A domain that is not prepared yet answers 403 REQS007: prepare it with POST /v1/extract/prepared-domains, then retry."
        method: GET
        path: /
        input:
          queryParams:
            type: object
            properties:
              url:
                type: string
                format: uri
                pattern: ^https?://
                examples:
                  - https://www.scrapingcourse.com/ecommerce/
                description: The URL of the page to retrieve. Only `http` and `https` URLs are accepted.
              extract:
                type: string
                enum:
                  - auto
                  - native
                  - standard
                description: "Return structured JSON extracted from the page with no selectors to write (Extract). Omit it and Extract is off. `auto` and `native` return the website's own field names; `standard` returns a canonical schema shared by every website in a vertical (real estate only for now). Extract works on any prepared domain, with any active API key (prepare a new one with `POST /extract/prepared-domains`), and is currently free on top of the Fetch cost. A domain, or a kind of page on it, that is not prepared yet answers 403 `REQS007`: see `requestExtractDomain`."
              extract_fields:
                type: string
                examples:
                  - products.name,products.price
                description: Comma-separated list of the fields `extract` should return, dot-notated for fields inside a group (for example `products.name,products.price`). Omit it to receive every field.
              css_extractor:
                type: string
                examples:
                  - '{"title":"h1","price":".price"}'
                description: JSON object mapping output keys to CSS selectors, applied to the retrieved page.
              mode:
                type: string
                enum:
                  - auto
                description: Adaptive Stealth Mode. `auto` starts from the cheapest viable configuration and escalates to JavaScript rendering or premium proxies only when the target requires it. You are billed for the configuration that succeeds. It manages `js_render` and `premium_proxy` itself, so setting either alongside it answers 400 `REQS004`; `proxy_country` is allowed.
              js_render:
                type: boolean
                default: false
                description: Render the page in a headless browser before returning it. Required for content that only exists after JavaScript runs. Not allowed with `mode=auto` (400 `REQS004`).
              premium_proxy:
                type: boolean
                default: false
                description: Route the request through residential IPs. Required by most protected sites. Not allowed with `mode=auto` (400 `REQS004`).
              proxy_country:
                type: string
                pattern: ^[a-z]{2}$
                examples:
                  - us
                description: Two-letter country code for the exit IP. Requires `premium_proxy=true` or `mode=auto`, which then routes through premium proxies, so the request costs at least 10 credits. Alone, or with only `js_render`, the request answers 400 `REQS004`.
            required:
              - url
        effect: read
        example:
          queryParams:
            url: https://www.scrapingcourse.com/ecommerce/
            proxy_country: us
            css_extractor: '{"title":"h1","price":".price"}'
            extract_fields: products.name,products.price
        price:
          kind: per_unit
          priceMicros: 500
          currency: USD
          chargeOn: success
          unit: credit
          meter:
            kind: response_usage
          maximumMicros: 12500
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Credits per successful request: 1 credit for a basic request, 5 with JavaScript rendering, 10 with premium proxies and 25 with both, the same on every plan; Extract adds no credits on top of the request it runs. Each response reports the credits it used in the X-Request-Credits header. The public pay-as-you-go rate is $0.50 per 1,000 credits."
        priceTerms:
          details: "Metered from the X-Request-Credits response header: the credits the request used, times the per-credit price; a request Zenrows could not carry out uses no credits, but Zenrows counts a 404 or 410 from the target as a request it carried out, and charges for it."
      - id: list_extract_domains
        name: List the domains Extract serves
        description: "The domains Extract lists publicly as ready. A domain in this list works with `extract=auto`. The list is not complete: some prepared domains are not listed and still work, so a domain missing from it is not proof it answers `REQS007`. Send the request and branch on `REQS007`, or prepare the domain with `requestExtractDomain`. Costs no credits. Documented at https://docs.zenrows.com/extract/endpoints."
        method: GET
        path: /extract/domains
        input: {}
        effect: read
        price:
          kind: free
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Uses no credits: it fetches no pages."
      - id: request_extract_domain
        name: Ask for a domain to be prepared for Extract
        description: "Submit a domain for preparation, within a monthly allowance. The submission is accepted immediately and works through discovery, preparation and verification, typically in minutes: poll `getExtractDomainStatus` instead of blocking. Send `example_urls` when you can; they replace discovery. One URL works, but up to 5 related URLs work better: Extract compares the pages of one type against each other, so it can check the fields it found and fill in fields one page is missing. Send at least 3 pages of your main page type; other types can share the rest of the 5 (for example 3 product pages and 2 search result pages). Submitting a domain that is already prepared returns its current record rather than starting again, so it does not add new kinds of page. Send an `Idempotency-Key` header to make a retry safe. Costs no credits. Documented at https://docs.zenrows.com/extract/endpoints."
        method: POST
        path: /extract/prepared-domains
        input:
          body:
            type: object
            required:
              - domain
            properties:
              domain:
                type: string
                description: The domain to prepare, without scheme.
                example: scrapingcourse.com
              example_urls:
                type: array
                items:
                  type: string
                  format: uri
                description: 1 to 5 URLs on that domain. One works; at least 3 pages of your main page type work better, and other types can share the rest of the 5. When present, they replace discovery.
                example:
                  - https://www.scrapingcourse.com/ecommerce/product/abominable-hoodie/
                  - https://www.scrapingcourse.com/ecommerce/product/adrienne-trek-jacket/
                  - https://www.scrapingcourse.com/ecommerce/product/aeon-capri/
        effect: write
        price:
          kind: free
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Uses no credits: it fetches no pages."
      - id: get_extract_domain_status
        name: Track a domain's preparation
        description: How far a submission has got. Branch on `status` (`preparing`, `ready`, `failed`); `state` is the finer-grained step. Costs no credits. Documented at https://docs.zenrows.com/extract/endpoints.
        method: GET
        path: /extract/prepared-domains/{domain}
        input:
          pathParams:
            type: object
            properties:
              domain:
                type: string
                description: The domain, without scheme.
            required:
              - domain
        effect: read
        example:
          pathParams:
            domain: scrapingcourse.com
        price:
          kind: free
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Uses no credits: it fetches no pages."
      - id: create_batch_job
        name: Create a batch job (many URLs in one request)
        description: |
          Validates inputs and authenticates the caller, then persists
          the job, its first run, and (for small submits) all tasks
          before returning. Validation failures (4xx) create nothing. A
          `503` from a temporary failure usually creates nothing
          either, but a late-stage failure can leave the job visible
          with its run already `stopped`: safe to `DELETE`. A `503`
          that came before the job was created gives the
          `Idempotency-Key` back, so the same key works on retry. A
          `503` after the job was created keeps the key (a retry under
          it is `409 idempotency_key_conflict`): check `GET /v1/jobs`
          before you resend with a fresh key.

          Submissions under 10,000 inline `tasks` return `201 Created`
          with the task rows already in place: results are immediately
          queryable via `GET /v1/jobs/{id}/results`.

          Submissions at or above **10,000 inline tasks** are processed
          off the request path and return `202 Accepted`: `accepted_tasks`
          is the final validated count, but task rows stream into
          storage over the following seconds (large submissions can take
          longer). `GET /v1/jobs/{id}/results` returns only the rows
          written so far until ingest completes; the run's `stats.total`
          is correct from the start so completion polling
          (`stats.completed >= stats.total`) is reliable from the first
          response. While ingestion is in progress,
          `POST /v1/jobs/{id}/tasks` on an open job returns `409`:
          retry it once results pages fill out. The run's
          `ingest_status` field reports the ingest state: poll
          `GET /v1/jobs/{id}` until `latest_run.ingest_status` is
          `done` to know every task row is visible.

          Limits (defaults; an account can have its own): at most
          100,000 tasks per submit, 3 active (non-terminal) regular
          jobs and 5 scheduled jobs per account. An open job holds an
          active slot until it is closed; an idle open job is closed
          automatically after 48 hours. A `rate` schedule must fire at
          most once every 60 minutes. Going over a job cap returns
          `429 quota_exceeded`; going over the task limit or the
          schedule interval returns `400 invalid_argument`. A request
          refused by one of these checks gives its `Idempotency-Key`
          back: once you free a slot (or fix the request), retry with
          the same key.
        baseUrl: https://async.api.zenrows.com/v1
        auth:
          kind: header
          headerName: X-API-Key
        method: POST
        path: /jobs
        input:
          body:
            type: object
            properties:
              type:
                type: string
                enum:
                  - regular
                  - scheduled
                default: regular
                description: |
                  - `regular`: a run is created at submit time.
                  - `scheduled`: fires on a recurring or one-shot schedule.
                    Submit stores the task list as a template on the job row;
                    each scheduled fire produces a fresh Run. `schedule`
                    field required. Read-only template: `addBatchTasks` and
                    `close` return 409. `rerun` (full or filtered) and `stop`
                    are allowed.
              status:
                type: string
                enum:
                  - open
                  - closed
                default: closed
                description: |
                  Initial state. `open` is only allowed for `regular` jobs;
                  after the initial run, `open` has no meaning so the job
                  is auto-closed.
              zenrows_params:
                type: object
                description: |
                  Subset of the Fetch parameters
                  (https://docs.zenrows.com/fetch/api-reference).
                  The API pins the surface to a known set: unknown keys are
                  rejected with `400 invalid_argument` (`unknown_param`). The
                  `screenshot*` family is deliberately excluded; `mode` accepts
                  `"auto"` only for now.

                  Each value can be any JSON scalar (string, boolean, integral
                  number); the API stores it as a string.

                  Per-task `zenrows_params` override job-level `zenrows_params`
                  on key collision.

                  Supported keys: `mode`, `js_render`, `js_instructions`,
                  `custom_headers`, `premium_proxy`, `proxy_country`,
                  `session_id`, `original_status`, `allowed_status_codes`,
                  `wait_for`, `wait`, `block_resources`, `json_response`,
                  `css_extractor`, `autoparse`, `extract`, `extract_fields`,
                  `response_type`, `outputs`.

                  `extract` selects the structured-extraction contract family
                  (`auto`, `native`, or `standard`); `extract_fields` optionally
                  narrows the returned fields. Extract works on any domain
                  Zenrows has prepared, with any active API key; a task against a
                  domain that isn't prepared yet fails with the scraper API's
                  403 `REQS007`.

                  `custom_headers` additionally accepts an object of header
                  name → value pairs (or that object serialised as a JSON
                  string), e.g. `{"custom_headers": {"Referer":
                  "https://www.google.com/"}}`. The headers are forwarded to
                  the scraping target, subject to the scraper API's usual
                  header sanitisation. At most 32 headers / 8 KB serialised;
                  names must be valid HTTP tokens. Header filtering and
                  browser-header sanitisation follow the same rules as a
                  single Fetch request.
                  A task-level
                  `custom_headers` replaces the job-level object wholesale:
                  no per-name merging.
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: boolean
                    - type: integer
                    - type: object
                      additionalProperties:
                        type: string
              schedule:
                type: object
                description: |
                  Structured scheduling block attached to `type: scheduled`
                  jobs. Exactly one of `at`, `rate`, or `calendar` must be
                  set.
                properties:
                  at:
                    type: string
                    description: |
                      One-shot fire at a specific wall-clock timestamp.
                      Mutually exclusive with `rate` and `calendar`.

                      **Must be tz-naive**: no trailing `Z`, no offset. The
                      sibling `timezone` field (mandatory) is the single
                      authoritative interpreter. This keeps DST transitions
                      deterministic.
                    example: 2026-09-01T09:00:00
                  rate:
                    type: object
                    required:
                      - every
                      - unit
                    description: |
                      Interval-based fire policy: every N units. The interval must
                      be at least 60 minutes by default (an account can have its own
                      minimum); a shorter one returns `400 invalid_argument`.
                    properties:
                      every:
                        type: integer
                        minimum: 1
                        example: 6
                      unit:
                        type: string
                        enum:
                          - minute
                          - hour
                          - day
                        example: hour
                  calendar:
                    type: object
                    required:
                      - times_of_day
                      - cadence
                    description: |
                      Calendar-style fire policy. Fires at every `times_of_day`
                      entry on every day matching the cadence.
                    properties:
                      times_of_day:
                        type: array
                        minItems: 1
                        description: |
                          Wall-clock times on a 24-hour clock, full hours only
                          (`"09:00"`, `"18:00"`). Minute granularity is rejected
                          with 400.
                        items:
                          type: string
                          pattern: ^([01][0-9]|2[0-3]):00$
                        example:
                          - 09:00
                          - 18:00
                      cadence:
                        type: object
                        description: |
                          Picks which days the schedule fires on. Exactly one of
                          `daily`, `weekly`, `monthly` must be set.
                        properties:
                          daily:
                            type: object
                            description: Fire every day. No knobs.
                          weekly:
                            type: object
                            required:
                              - days
                            properties:
                              days:
                                type: array
                                minItems: 1
                                items:
                                  type: string
                                  enum:
                                    - mon
                                    - tue
                                    - wed
                                    - thu
                                    - fri
                                    - sat
                                    - sun
                                example:
                                  - mon
                                  - wed
                                  - fri
                          monthly:
                            type: object
                            required:
                              - days
                            properties:
                              days:
                                type: array
                                minItems: 1
                                items:
                                  type: integer
                                  minimum: 1
                                  maximum: 31
                                example:
                                  - 1
                                  - 15
                  timezone:
                    type: string
                    description: |
                      IANA timezone name (e.g. `Europe/Berlin`, `UTC`).
                      **Required** when `at` or `calendar` is set;
                      ignored by `rate` (interval-based, no wall-clock
                      meaning). Anchoring wall-clock times to a named zone
                      (rather than a UTC offset baked into the string) keeps
                      DST transitions deterministic.
                    example: Europe/Berlin
              tasks:
                type: array
                description: |
                  Required for closed jobs (1 to 100,000 tasks by default;
                  an account can have its own limit) unless `file_input_id`
                  is provided. Optional for open jobs: may be empty if the
                  caller will follow up with `addBatchTasks`. Mutually exclusive
                  with `file_input_id`.
                minItems: 0
                items:
                  type: object
                  required:
                    - url
                  properties:
                    external_id:
                      type: string
                      maxLength: 128
                      pattern: ^[A-Za-z0-9._-]+$
                      description: |
                        Optional caller-supplied correlation id: typically an
                        identifier from the caller's own system. Surfaced verbatim
                        in result/content responses so callers can match results
                        back to their records. **Not required to be unique**:
                        callers may reuse the same value across tasks (e.g. when
                        multiple scrapes correlate to the same upstream record).
                        Independent of the server-
                        assigned `task_id`.
                    url:
                      type: string
                      format: uri
                      maxLength: 2048
                      description: Must be http(s). Other schemes rejected at submit.
                    metadata:
                      type: object
                      description: Opaque user-supplied key/value pairs. Stored on the task; not forwarded.
                      additionalProperties:
                        type: string
                        maxLength: 1024
                      maxProperties: 20
                    method:
                      type: string
                      enum:
                        - GET
                        - POST
                      default: GET
                      description: |
                        HTTP method used against `url`. Case-insensitive. POST is
                        for **safe/idempotent** requests only (GraphQL queries,
                        search endpoints): tasks are retried on transient failures
                        and reruns, so the target may see the same POST more than
                        once. Don't send a request that must not run twice. POST
                        rides the standard (non-headless)
                        scraping path: combining it with `js_render`,
                        `js_instructions`, or `json_response` is rejected with
                        `400 invalid_argument`, the task's `invalid_tasks[].reason`
                        being `method_param_conflict`.
                    body:
                      description: |
                        Request body, only with `method: POST`. Any JSON value,
                        16 KiB max. An object/array/number/boolean is sent as its
                        JSON encoding with `Content-Type: application/json`; a
                        string is sent verbatim with
                        `Content-Type: application/x-www-form-urlencoded`. Set a
                        different target Content-Type via the `custom_headers`
                        zenrows param. Never echoed in results listings.
                    zenrows_params:
                      type: object
                      description: |
                        Subset of the Fetch parameters
                        (https://docs.zenrows.com/fetch/api-reference).
                        The API pins the surface to a known set: unknown keys are
                        rejected with `400 invalid_argument` (`unknown_param`). The
                        `screenshot*` family is deliberately excluded; `mode` accepts
                        `"auto"` only for now.

                        Each value can be any JSON scalar (string, boolean, integral
                        number); the API stores it as a string.

                        Per-task `zenrows_params` override job-level `zenrows_params`
                        on key collision.

                        Supported keys: `mode`, `js_render`, `js_instructions`,
                        `custom_headers`, `premium_proxy`, `proxy_country`,
                        `session_id`, `original_status`, `allowed_status_codes`,
                        `wait_for`, `wait`, `block_resources`, `json_response`,
                        `css_extractor`, `autoparse`, `extract`, `extract_fields`,
                        `response_type`, `outputs`.

                        `extract` selects the structured-extraction contract family
                        (`auto`, `native`, or `standard`); `extract_fields` optionally
                        narrows the returned fields. Extract works on any domain
                        Zenrows has prepared, with any active API key; a task against a
                        domain that isn't prepared yet fails with the scraper API's
                        403 `REQS007`.

                        `custom_headers` additionally accepts an object of header
                        name → value pairs (or that object serialised as a JSON
                        string), e.g. `{"custom_headers": {"Referer":
                        "https://www.google.com/"}}`. The headers are forwarded to
                        the scraping target, subject to the scraper API's usual
                        header sanitisation. At most 32 headers / 8 KB serialised;
                        names must be valid HTTP tokens. Header filtering and
                        browser-header sanitisation follow the same rules as a
                        single Fetch request.
                        A task-level
                        `custom_headers` replaces the job-level object wholesale:
                        no per-name merging.
                      additionalProperties:
                        oneOf:
                          - type: string
                          - type: boolean
                          - type: integer
                          - type: object
                            additionalProperties:
                              type: string
              file_input_id:
                type: string
                description: |
                  Reference to a previously-uploaded CSV input (see
                  `POST /v1/job_inputs`). Mutually exclusive with `tasks`.
                  Eligible only for regular-closed and scheduled job types.
                  The uploaded CSV is parsed under the saved spec; its rows
                  become the tasks (regular-closed) or the task template
                  (scheduled).
              external_id:
                type: string
                maxLength: 128
                pattern: ^[A-Za-z0-9._-]+$
                description: |
                  Optional caller-supplied correlation id for the job:
                  same semantics as `task.external_id`. Shape-checked,
                  **not** required to be unique. Surfaced verbatim in
                  `getBatchJob` / `listBatchJobs` responses.
              name:
                type: string
                maxLength: 100
                description: |
                  Optional human-readable label for the job. Free-form:
                  no shape rules. Up to 100 characters. Surfaced verbatim
                  in `getBatchJob` / `listBatchJobs` responses. No uniqueness, no
                  indexing; cannot be changed after submit.
              metadata:
                type: object
                description: Opaque user-supplied key/value pairs. Stored on the task; not forwarded.
                additionalProperties:
                  type: string
                  maxLength: 1024
                maxProperties: 20
              webhook:
                type: object
                required:
                  - url
                description: |
                  The webhook block accepted at submit: `url` is required and
                  `signature` defaults to `false`. `PUT /v1/jobs/{id}/webhook`
                  takes `BatchWebhookConfig`, which requires both.
                properties:
                  url:
                    type: string
                    format: uri
                    description: HTTPS URL that receives the run events.
                  signature:
                    type: boolean
                    default: false
                    description: Sign each delivery with the account's active HMAC key (see `BatchWebhookConfig.signature`).
        effect: write
        price:
          kind: unresolved
          reason: "Billed after it runs: each page or task it fetches is a Fetch request of 1 to 25 credits at $0.50 per 1,000 credits, so the charge is only known as it runs."
      - id: get_batch_job
        name: Read a job and its latest run
        description: The job and its latest run. Progress is in latest_run.stats and spend in latest_run.stats.spend. Poll with backoff until latest_run.status is terminal.
        baseUrl: https://async.api.zenrows.com/v1
        auth:
          kind: header
          headerName: X-API-Key
        method: GET
        path: /jobs/{job_id}
        input:
          pathParams:
            type: object
            properties:
              job_id:
                type: string
                pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                description: Assigned by the server on submit.
            required:
              - job_id
        effect: read
        price:
          kind: free
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Uses no credits: it fetches no pages."
      - id: cancel_batch_job
        name: Cancel the current run
        description: |
          User-facing alias for `/stop`. Same semantics, same terminal
          `stopped` state, same response shape.
        baseUrl: https://async.api.zenrows.com/v1
        auth:
          kind: header
          headerName: X-API-Key
        method: POST
        path: /jobs/{job_id}/cancel
        input:
          pathParams:
            type: object
            properties:
              job_id:
                type: string
                pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                description: Assigned by the server on submit.
            required:
              - job_id
        effect: write
        price:
          kind: free
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Uses no credits: it fetches no pages."
      - id: get_batch_results
        name: Page through per-task results for the latest run of a job
        description: Shortcut for the latest run; see `getBatchRunResults` for the explicit form.
        baseUrl: https://async.api.zenrows.com/v1
        auth:
          kind: header
          headerName: X-API-Key
        method: GET
        path: /jobs/{job_id}/results
        input:
          queryParams:
            type: object
            properties:
              status:
                type: string
                enum:
                  - all
                  - successful
                  - failed
                  - processing
                default: all
                description: |
                  `processing` covers both `pending` and `processing` task
                  states (anything not yet terminal).
              cursor:
                type: string
                description: Opaque pagination token; echo `next_cursor`.
          pathParams:
            type: object
            properties:
              job_id:
                type: string
                pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                description: Assigned by the server on submit.
            required:
              - job_id
        effect: read
        price:
          kind: free
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Uses no credits: it fetches no pages."
      - id: get_batch_task_content
        name: Fetch the scraped content for a task in the latest run
        description: Latest-run shortcut. See `getBatchRunTaskContent` for explicit-run form.
        baseUrl: https://async.api.zenrows.com/v1
        auth:
          kind: header
          headerName: X-API-Key
        method: GET
        path: /jobs/{job_id}/tasks/{task_id}/content
        input:
          pathParams:
            type: object
            properties:
              job_id:
                type: string
                pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                description: Assigned by the server on submit.
              task_id:
                type: string
                pattern: ^[A-Za-z0-9._-]{1,128}$
                description: Server-assigned task id within a run. Use `external_id` for your own correlation id.
            required:
              - job_id
              - task_id
        effect: read
        price:
          kind: free
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Uses no credits: it fetches no pages."
      - id: start_crawl
        name: Start a crawl
        description: Start a crawl from one URL and return at once with `202 Accepted`, the crawl in the body and its path in the `Location` header. Each page it opens is one Fetch request with Adaptive Stealth Mode, billed 1 to 25 credits; failed pages are not billed. Documented at https://docs.zenrows.com/crawl/endpoints#start-a-crawl.
        method: POST
        path: /crawls
        input:
          body:
            type: object
            required:
              - url
            additionalProperties: false
            properties:
              url:
                type: string
                format: uri
                maxLength: 2048
                description: "The start URL: a public `http` or `https` URL. The crawl starts on this exact URL and stays on its domain, subdomains included."
              depth:
                type: integer
                minimum: 1
                maximum: 100000
                description: How many link steps to follow from the start URL. At `1`, the links on the start page. Omit it to follow links until `max_items` or `max_pages` stops the crawl.
              max_items:
                type: integer
                minimum: 1
                maximum: 100000
                default: 100
                description: Stop after keeping this many URLs.
              max_pages:
                type: integer
                minimum: 1
                maximum: 100000
                default: 100
                description: Stop after fetching this many pages. Caps what the crawl costs. If both limits are reached together, `stop_reason` is `max_pages`.
              include_patterns:
                type: array
                items:
                  type: string
                description: Keep, and open, only URLs that contain at least one of these texts, such as `/product/`. The start URL is never returned.
              exclude_patterns:
                type: array
                items:
                  type: string
                description: Drop URLs that contain any of these texts, even when they match an include pattern.
              output_format:
                type: string
                enum:
                  - html
                description: "`html` also returns the HTML of each kept page. Omit it to get URLs only."
        effect: write
        example:
          body:
            url: https://www.scrapingcourse.com/ecommerce/
            max_pages: 10
            include_patterns:
              - /product/
        price:
          kind: unresolved
          reason: "Billed after it runs: each page or task it fetches is a Fetch request of 1 to 25 credits at $0.50 per 1,000 credits, so the charge is only known as it runs."
      - id: get_crawl
        name: Read a crawl and its results
        description: "The crawl, its coverage so far and one page of results. While it runs, `next_cursor` is never `null`: read again with the same cursor to get only the new URLs. Each URL is returned once. Documented at https://docs.zenrows.com/crawl/endpoints#read-a-crawl."
        method: GET
        path: /crawls/{crawl_id}
        input:
          queryParams:
            type: object
            properties:
              cursor:
                type: string
                description: The `next_cursor` from the previous read. Omit it to start from the first result.
              limit:
                type: integer
                minimum: 1
                maximum: 10000
                default: 1000
                description: How many results to return.
          pathParams:
            type: object
            properties:
              crawl_id:
                type: string
                description: The crawl's ID, as returned when it started.
            required:
              - crawl_id
        effect: read
        example:
          pathParams:
            crawl_id: c_01M3XP7RZD4JT88F7PNPGBFRAF
        price:
          kind: free
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Uses no credits: it fetches no pages."
      - id: download_crawl
        name: Download all results
        description: Every result as one NDJSON file named `{crawl_id}.jsonl`, one JSON object per line. Each line has the `url`; with `output_format`, also `content_status` and, once fetched, the page HTML in `content`. While the crawl runs, a later download may hold more lines. Documented at https://docs.zenrows.com/crawl/endpoints#download-the-results.
        method: GET
        path: /crawls/{crawl_id}/download
        input:
          pathParams:
            type: object
            properties:
              crawl_id:
                type: string
                description: The crawl's ID, as returned when it started.
            required:
              - crawl_id
        effect: read
        example:
          pathParams:
            crawl_id: c_01M3XP7RZD4JT88F7PNPGBFRAF
        price:
          kind: free
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Uses no credits: it fetches no pages."
      - id: get_crawl_content
        name: Read one page's HTML
        description: The HTML of one kept page, for a crawl started with `output_format`. Take the path from the result's `content_url`. Documented at https://docs.zenrows.com/crawl/endpoints#read-a-page.
        method: GET
        path: /crawls/{crawl_id}/contents/{content_id}
        input:
          queryParams:
            type: object
            properties:
              download:
                type: boolean
                default: false
                description: "`true` returns the page as a file to save."
          pathParams:
            type: object
            properties:
              crawl_id:
                type: string
                description: The crawl's ID, as returned when it started.
              content_id:
                type: string
                description: From the result's `content_url`.
            required:
              - crawl_id
              - content_id
        effect: read
        example:
          pathParams:
            crawl_id: c_01M3XP7RZD4JT88F7PNPGBFRAF
        price:
          kind: free
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Uses no credits: it fetches no pages."
      - id: stop_crawl
        name: Stop a crawl
        description: Stop a running crawl. No new page is fetched; pages already being fetched finish, are billed and are kept for up to 10 minutes. Read the crawl until `next_cursor` is `null` for its final results. A crawl that already ended returns its final state. Send no body. Documented at https://docs.zenrows.com/crawl/endpoints#stop-a-crawl.
        method: POST
        path: /crawls/{crawl_id}/stop
        input:
          pathParams:
            type: object
            properties:
              crawl_id:
                type: string
                description: The crawl's ID, as returned when it started.
            required:
              - crawl_id
        effect: write
        example:
          pathParams:
            crawl_id: c_01M3XP7RZD4JT88F7PNPGBFRAF
        price:
          kind: free
          evidence:
            url: https://docs.zenrows.com/first-steps/pricing
            observedAt: 2026-11-13T09:00:00Z
            note: "Uses no credits: it fetches no pages."
