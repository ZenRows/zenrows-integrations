name: Activepieces piece

on:
  push:
    branches: [main]
    paths:
      - platforms/activepieces/**
      - dist/activepieces/**
      - shared/text/**
      - scripts/**
      - .github/workflows/activepieces.yml
  pull_request:
    paths:
      - platforms/activepieces/**
      - dist/activepieces/**
      - shared/text/**
      - scripts/**
      - .github/workflows/activepieces.yml

permissions:
  contents: read

jobs:
  check:
    name: Lint, build and test in activepieces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      # activepieces' packageManager at the pinned commit. If they differ,
      # check.sh installs the right version instead.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-activepieces-${{ hashFiles('platforms/activepieces/vars.yaml') }}
          restore-keys: bun-activepieces-
      - run: platforms/activepieces/scripts/check.sh
