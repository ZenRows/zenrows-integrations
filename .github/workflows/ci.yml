name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    name: Render and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # dist/ must match a fresh render: it's generated, never edited by hand.
      - run: npm run render -- --check
      # Frontmatter, skill references, manifests against their JSON Schemas, and overrides.lock.
      - run: npm run validate

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint, with shellcheck for the run: scripts. Pinned to a version.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
