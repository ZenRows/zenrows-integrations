# What we offer to every host, and how each endpoint is billed: by the credits each
# request uses, after it runs (each page or task it fetches), or not at all. Every
# API operation is in exactly one list, directly or through the shared endpoints
# (shared/endpoints.yaml) that split it; not_offered is what no host lists. A new
# API operation fails the render until it's added here.
per_credit: [fetch, extract]
after_run: [POST /jobs, POST /crawls]
free: [GET /extract/domains, POST /extract/prepared-domains, "GET /extract/prepared-domains/{domain}", get_batch_job, "POST /jobs/{job_id}/cancel", "GET /jobs/{job_id}/results", "GET /jobs/{job_id}/tasks/{task_id}/content", "GET /crawls/{crawl_id}", "GET /crawls/{crawl_id}/download", "GET /crawls/{crawl_id}/contents/{content_id}", "POST /crawls/{crawl_id}/stop"]
not_offered: [POST /, PUT /, GET /extract/prepared-domains, GET /extract/prepared-domains/allowance, POST /api/agent/signup, GET /api/agent/account, GET /subscriptions/self/details, GET /jobs, "POST /jobs/{job_id}/tasks", "POST /jobs/{job_id}/close", "POST /jobs/{job_id}/stop", "POST /jobs/{job_id}/pause", "POST /jobs/{job_id}/resume", "POST /jobs/{job_id}/rerun", "DELETE /jobs/{job_id}", "DELETE /jobs/{job_id}/runs/{run_id}", "GET /jobs/{job_id}/runs", "GET /jobs/{job_id}/runs/{run_id}", "GET /jobs/{job_id}/runs/{run_id}/results", "GET /jobs/{job_id}/runs/{run_id}/tasks/{task_id}/content", "GET /jobs/{job_id}/runs/{run_id}/tasks/{task_id}/history", "GET /jobs/{job_id}/tasks/{task_id}/history", "POST /jobs/{job_id}/runs/{run_id}/exports", "GET /jobs/{job_id}/runs/{run_id}/exports/{export_id}", "PUT /jobs/{job_id}/schedule", "POST /jobs/{job_id}/schedule/state", "GET /jobs/{job_id}/webhook", "PUT /jobs/{job_id}/webhook", "DELETE /jobs/{job_id}/webhook", POST /webhook/test, POST /job_inputs, GET /hmac/keys, POST /hmac/keys/rotate, DELETE /hmac/keys/rotate, POST /hmac/keys/rotate/finalize, GET /crawls, GET /ask, POST /ask, POST /mcp]
